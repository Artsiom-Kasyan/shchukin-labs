name: Проверка реестра и выпуск отчёта
on:
  push:
    branches: [lab-06]
    tags: ['debts-v*']
  pull_request:
    branches: [lab-06]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v
  report:
    if: startsWith(github.ref, 'refs/tags/debts-v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 debts.py > report.md
      - uses: actions/upload-artifact@v4
        with:
          name: debt-report
          path: report.md
